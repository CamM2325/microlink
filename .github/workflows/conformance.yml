name: Conformance

# MicroLink in QEMU (ESP32, emulated Ethernet) against a real Headscale and
# a real Tailscale client: the device must register, come up and answer
# pings through the WireGuard tunnel. See tests/conformance/headscale_qemu.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headscale-qemu:
    name: Headscale + Tailscale client + QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run
        run: tests/conformance/headscale_qemu.sh
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-logs
          path: build-conformance/*.log
          if-no-files-found: ignore
